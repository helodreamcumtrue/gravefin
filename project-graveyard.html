<style>
:root{
  --bg:#0A0C0F;
  --bg-soft:#0D1013;
  --surface:#14171C;
  --surface-2:#1A1E24;
  --surface-3:#20252C;
  --border:#262B33;
  --border-soft:#1D2129;
  --text:#EDEFF2;
  --text-muted:#8D93A0;
  --text-dim:#5B6270;
  --accent:#E8A24A;
  --accent-dim:#7A5A2E;
  --accent-2:#5FB3A3;
  --success:#5FB3A3;
  --warning:#E8A24A;
  --error:#E2666D;
  --r-sm:9px;
  --r-md:14px;
  --r-lg:22px;
  --r-pill:999px;
  --shadow-card:0 1px 1px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.7);
  --shadow-elevated:0 4px 10px rgba(0,0,0,.55), 0 30px 60px -20px rgba(0,0,0,.75);
  --font-display:'Sora',sans-serif;
  --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
body{background:
  radial-gradient(1200px 500px at 15% -10%, rgba(232,162,74,.05), transparent 60%),
  radial-gradient(900px 500px at 100% 0%, rgba(95,179,163,.04), transparent 55%),
  var(--bg);
}
h1,h2,h3,h4,.font-display{font-family:var(--font-display);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:rgba(232,162,74,.35);}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:#2a2f38;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
.no-scrollbar::-webkit-scrollbar{display:none;}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}

.container{max-width:1220px;margin:0 auto;padding:0 24px;}
@media (max-width:640px){.container{padding:0 16px;}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-sm);font-weight:600;font-size:14px;padding:11px 18px;border:1px solid transparent;transition:transform .15s ease, background .15s ease, border-color .15s ease, opacity .15s ease;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:#1a1206;}
.btn-primary:hover{background:#f0ae5c;}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--border);}
.btn-secondary:hover{background:var(--surface-3);}
.btn-ghost{background:transparent;color:var(--text-muted);}
.btn-ghost:hover{color:var(--text);background:var(--surface-2);}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:rgba(226,102,109,.12);color:var(--error);border-color:rgba(226,102,109,.3);}
.btn-danger:hover{background:rgba(226,102,109,.2);}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-block{width:100%;}
.btn-icon{padding:9px;border-radius:var(--r-sm);}

.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r-md);box-shadow:var(--shadow-card);}
.surface2{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);}

.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r-pill);font-size:12.5px;font-weight:500;background:var(--surface-3);color:var(--text-muted);border:1px solid var(--border);}
.chip-accent{background:rgba(232,162,74,.12);color:var(--accent);border-color:rgba(232,162,74,.25);}
.chip-teal{background:rgba(95,179,163,.12);color:var(--accent-2);border-color:rgba(95,179,163,.25);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;}
.badge-pending{background:rgba(232,162,74,.14);color:var(--accent);}
.badge-accepted{background:rgba(95,179,163,.14);color:var(--accent-2);}
.badge-rejected{background:rgba(226,102,109,.14);color:var(--error);}

.input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 14px;color:var(--text);font-size:14px;transition:border-color .15s;}
.input::placeholder{color:var(--text-dim);}
.input:focus{border-color:var(--accent);}
textarea.input{resize:vertical;min-height:90px;}
.label{font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;display:block;}

.progress-track{width:100%;height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#c97f2e,var(--accent));transition:width .5s ease;}

.avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#0a0c0f;flex-shrink:0;font-family:var(--font-display);}

.hover-lift{transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
.hover-lift:hover{transform:translateY(-3px);border-color:#333a45;box-shadow:var(--shadow-elevated);}

.modal-backdrop{position:fixed;inset:0;background:rgba(6,7,9,.65);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeIn .15s ease;}
.modal{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-elevated);max-width:460px;width:100%;max-height:88vh;overflow-y:auto;animation:modalIn .18s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--surface-3);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:13px 16px;font-size:13.5px;box-shadow:var(--shadow-elevated);min-width:240px;animation:toastIn .2s ease;}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--r-sm);}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

.nav-link{color:var(--text-muted);font-size:14px;font-weight:500;padding:8px 4px;border-bottom:2px solid transparent;transition:color .15s;}
.nav-link:hover,.nav-link.active{color:var(--text);}
.nav-link.active{border-bottom-color:var(--accent);}

.sidebar-link{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--text-muted);font-size:13.5px;font-weight:500;transition:background .15s,color .15s;}
.sidebar-link:hover{background:var(--surface-2);color:var(--text);}
.sidebar-link.active{background:rgba(232,162,74,.1);color:var(--accent);}

.scroller{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;}
.scroller>*{scroll-snap-align:start;}

@media(max-width:860px){.hide-mobile{display:none!important;}}
@media(min-width:861px){.hide-desktop{display:none!important;}}
</style>
</head>

/* ---------------- SMALL HELPERS ---------------- */
function timeAgo(dateStr){
  const d=new Date(dateStr);const now=new Date("2026-09-12");
  const days=Math.floor((now-d)/86400000);
  if(days<=0) return "today";
  if(days===1) return "yesterday";
  if(days<30) return days+"d ago";
  return Math.floor(days/30)+"mo ago";
}
function Avatar({user,size=36}){
  const bg=colorFor(user.id);
  return <div className="avatar" style={{width:size,height:size,background:bg,fontSize:size*0.38}}>{initialsOf(user.name)}</div>;
}
function Stars({value,size=14}){
  const full=Math.round(value);
  return <span style={{display:"inline-flex",gap:1,color:"var(--accent)"}}>
    {[1,2,3,4,5].map(i=><Icon key={i} name={i<=full?"starFilled":"star"} size={size}/>)}

}
function RatingBadge({value,count,label}){
  return <span style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:13,color:"var(--text-muted)"}}>
    <Icon name="starFilled" size={13} className="" />

    {label && <span>{label}</span>}
    {count!=null && <span style={{color:"var(--text-dim)"}}>({count})</span>}
  </span>;
}
function CompletionRing({value,size=64}){
  const r=(size-8)/2,c=2*Math.PI*r,off=c-(value/100)*c;
  return <div style={{position:"relative",width:size,height:size}}>
    <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
      <circle cx={size/2} cy={size/2} r={r} stroke="var(--surface-3)" strokeWidth="6" fill="none"/>
      <circle cx={size/2} cy={size/2} r={r} stroke="var(--accent)" strokeWidth="6" fill="none" strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round" style={{transition:"stroke-dashoffset .6s ease"}}/>
    </svg>
    <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:size*0.22,fontFamily:"var(--font-display)"}}>{value}%</div>
  </div>;
}
function Toast({toasts}){
  return <div className="toast-wrap">{toasts.map(t=><div className="toast" key={t.id}>{t.text}</div>)}</div>;
}

}

/* ---------------- APP STATE / ROOT ---------------- */
function App(){
  const [page,setPage]=useState("home");
  const [params,setParams]=useState({});
  const [authed,setAuthed]=useState(true);
  const [viewingAdmin,setViewingAdmin]=useState(false);
  const [projects,setProjects]=useState(initialProjects);
  const [requests,setRequests]=useState(initialRequests);
  const [conversations,setConversations]=useState(initialConversations);
  const [notifications,setNotifications]=useState(initialNotifications);
  const [reports,setReports]=useState(initialReports);
  const [bookmarks,setBookmarks]=useState(["p3","p9"]);
  const [ratedProjects,setRatedProjects]=useState([]);
  const [toasts,setToasts]=useState([]);
  const [users,setUsers]=useState(USERS);

  function toast(text){
    const id=Date.now()+Math.random();
    setToasts(t=>[...t,{id,text}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3200);
  }
  function go(p,pr={}){setPage(p);setParams(pr);window.scrollTo(0,0);}

  const me=users[CURRENT_USER_ID];

  function toggleBookmark(pid){
    setBookmarks(b=>{
      if(b.includes(pid)){toast("Removed from saved projects");return b.filter(x=>x!==pid);}
      toast("Project saved");return [...b,pid];
    });
  }

  function sendRequest(projectId,message){
    const project=projects.find(p=>p.id===projectId);
    const nr={id:"r"+Date.now(),projectId,fromUserId:CURRENT_USER_ID,toUserId:project.creatorId,message,status:"pending",date:"2026-09-12"};
    setRequests(r=>[nr,...r]);
    toast("Collaboration request sent");
  }

  function respondRequest(reqId,accept){
    setRequests(rs=>rs.map(r=>r.id===reqId?{...r,status:accept?"accepted":"rejected"}:r));
    const req=requests.find(r=>r.id===reqId);
    if(!req) return;
    if(accept){
      setProjects(ps=>ps.map(p=>p.id===req.projectId?{...p,currentCollaborators:[...new Set([...p.currentCollaborators,req.fromUserId])]}:p));
      setConversations(cs=>{
        const exists=cs.find(c=>c.participantIds.includes(req.fromUserId)&&c.participantIds.includes(req.toUserId)&&c.projectId===req.projectId);
        if(exists) return cs;
        return [...cs,{id:"c"+Date.now(),participantIds:[req.fromUserId,req.toUserId],projectId:req.projectId,messages:[]}];
      });
      toast("Request accepted — collaboration is now active");
    } else {
      toast("Request declined");
    }
  }

  function submitRating(projectId,rating,text){
    setProjects(ps=>ps.map(p=>{
      if(p.id!==projectId) return p;
      const newCount=p.ratingCount+1;
      const newAvg=((p.projectRating*p.ratingCount)+rating)/newCount;
      return {...p,projectRating:Math.round(newAvg*10)/10,ratingCount:newCount,reviews:[{userId:CURRENT_USER_ID,rating,text,date:"2026-09-12"},...p.reviews]};
    }));
    setRatedProjects(r=>[...r,projectId]);
    toast("Thanks for rating this project");
  }

  function addProject(data){
    const id="p"+Date.now();
    const np={id,...data,creatorId:CURRENT_USER_ID,projectRating:0,ratingCount:0,currentCollaborators:[],lastUpdated:"2026-09-12",status:"active",reviews:[]};
    setProjects(ps=>[np,...ps]);
    toast("Project submitted");
    return id;
  }

  function sendMessage(conversationId,text){
    setConversations(cs=>cs.map(c=>c.id===conversationId?{...c,messages:[...c.messages,{id:"m"+Date.now(),fromUserId:CURRENT_USER_ID,text,timestamp:new Date().toISOString()}]}:c));
  }

  function markNotifRead(id){setNotifications(ns=>ns.map(n=>n.id===id?{...n,read:true}:n));}
  function markAllRead(){setNotifications(ns=>ns.map(n=>({...n,read:true})));}

  const ctx={page,params,go,authed,setAuthed,viewingAdmin,setViewingAdmin,projects,setProjects,requests,setRequests,conversations,setConversations,
    notifications,setNotifications,reports,setReports,bookmarks,toggleBookmark,ratedProjects,submitRating,addProject,sendRequest,respondRequest,
    sendMessage,markNotifRead,markAllRead,users,me,toast};

  return <AppCtx.Provider value={ctx}>
    <div>
      {!viewingAdmin ? <Navbar/> : <AdminNavbar/>}
      <main>{renderPage()}</main>
      {!viewingAdmin && page!=="login" && page!=="signup" && <Footer/>}
      <Toast toasts={toasts}/>
    </div>
  </AppCtx.Provider>;

  function renderPage(){
    if(viewingAdmin) return <AdminPanel/>;
    switch(page){
      case "home": return <Home/>;
      case "browse": return <Browse/>;
      case "project": return <ProjectDetails/>;
      case "profile": return <Profile/>;
      case "dashboard": return authed?<Dashboard/>:<LoggedOutGate/>;
      case "submit": return authed?<SubmitProject/>:<LoggedOutGate/>;
      case "messages": return authed?<Messages/>:<LoggedOutGate/>;
      case "about": return <About/>;
      case "login": return <Login/>;
      case "signup": return <Signup/>;
      default: return <Home/>;
    }
  }
}

function HeroGraphic(){
  const nodes=[[260,60,7,"var(--accent)"],[120,110,5,"var(--accent-2)"],[330,150,4,"#7C9CF0"],[70,220,6,"var(--accent)"],[220,270,5,"var(--accent-2)"],[300,300,4,"#7C9CF0"],[150,320,4,"var(--accent)"]];
  const edges=[[0,1],[1,2],[0,2],[1,3],[3,4],[2,4],[4,5],[3,6],[4,6]];
  return <svg viewBox="0 0 380 360" width="100%" height="100%">
    <defs>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.15"/>
        <stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="200" cy="180" r="180" fill="url(#glow)"/>
    {edges.map(([a,b],i)=>{
      const [x1,y1]=nodes[a];const [x2,y2]=nodes[b];
      return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="var(--border)" strokeWidth="1.4"/>;
    })}
    {nodes.map(([x,y,r,color],i)=><circle key={i} cx={x} cy={y} r={r+4} fill={color} opacity="0.9"/>)}
  </svg>;
}

/* ---------------- BROWSE ---------------- */
function Browse(){
  const {go,params,projects}=useApp();
  const [loading,setLoading]=useState(true);
  const [query,setQuery]=useState("");
  const [category,setCategory]=useState(params.category||"Any");
  const [completion,setCompletion]=useState("Any");
  const [skill,setSkill]=useState("Any");
  const [projRating,setProjRating]=useState("Any");
  const [availability,setAvailability]=useState(params.availability?"looking":"Any");
  const [sort,setSort]=useState("rating");
  const [filtersOpen,setFiltersOpen]=useState(false);

  useEffect(()=>{const t=setTimeout(()=>setLoading(false),450);return ()=>clearTimeout(t);},[]);

  const filtered=useMemo(()=>{
    let list=projects.filter(p=>{
      if(query){
        const q=query.toLowerCase();
        const hay=[p.title,p.description,p.category,...p.technologies,...p.requiredSkills,USERS[p.creatorId].name].join(" ").toLowerCase();
        if(!hay.includes(q)) return false;
      }
      if(category!=="Any" && p.category!==category) return false;
      if(skill!=="Any" && !p.requiredSkills.includes(skill) && !p.technologies.includes(skill)) return false;
      if(completion!=="Any"){
        const [lo,hi]=completion.split("-").map(Number);
        if(p.completion<lo || p.completion>hi) return false;
      }
      if(projRating!=="Any" && p.projectRating<parseFloat(projRating)) return false;
      if(availability==="looking" && !p.looking) return false;
      return true;
    });
    switch(sort){
      case "rating": list.sort((a,b)=>b.projectRating-a.projectRating); break;
      case "mostComplete": list.sort((a,b)=>b.completion-a.completion); break;
      case "leastComplete": list.sort((a,b)=>a.completion-b.completion); break;
      case "recent": list.sort((a,b)=>new Date(b.lastUpdated)-new Date(a.lastUpdated)); break;
      case "collab": list.sort((a,b)=>(b.maxCollaborators-b.currentCollaborators.length)-(a.maxCollaborators-a.currentCollaborators.length)); break;
    }
    return list;
  },[projects,query,category,completion,skill,projRating,availability,sort]);

  const FiltersPanel=<div style={{display:"flex",flexDirection:"column",gap:18}}>
    <FilterGroup label="Category" value={category} onChange={setCategory} options={["Any",...CATEGORIES]}/>
    <FilterGroup label="Completion" value={completion} onChange={setCompletion} options={["Any","0-25","25-50","50-75","75-100"]} display={{"0-25":"0–25%","25-50":"25–50%","50-75":"50–75%","75-100":"75–100%"}}/>
    <FilterGroup label="Skill" value={skill} onChange={setSkill} options={["Any",...ALL_SKILLS.slice(0,10)]}/>
    <FilterGroup label="Project rating" value={projRating} onChange={setProjRating} options={["Any","4.5","4.0","3.5"]} display={{"4.5":"4.5+","4.0":"4.0+","3.5":"3.5+"}}/>
    <FilterGroup label="Collaboration" value={availability} onChange={setAvailability} options={["Any","looking"]} display={{looking:"Looking for collaborators"}}/>
    <button className="btn btn-ghost btn-sm" style={{alignSelf:"flex-start"}} onClick={()=>{setCategory("Any");setCompletion("Any");setSkill("Any");setProjRating("Any");setAvailability("Any");}}>Clear all filters</button>
  </div>;

  return <div className="container" style={{padding:"40px 0 70px"}}>
    <h1 className="font-display" style={{fontSize:28,fontWeight:700}}>Explore Projects</h1>
    <p style={{color:"var(--text-muted)",marginTop:6,marginBottom:26,fontSize:14}}>Discover unfinished projects and find the ones that match your skills.</p>

    <div style={{display:"flex",gap:10,marginBottom:22,flexWrap:"wrap"}}>
      <div style={{flex:1,minWidth:220,position:"relative"}}>
        <span style={{position:"absolute",left:13,top:12,color:"var(--text-dim)"}}><Icon name="search" size={16}/></span>
        <input className="input" style={{paddingLeft:38}} placeholder="Search by title, skill, tech, or creator..." value={query} onChange={e=>setQuery(e.target.value)}/>
      </div>
      <button className="btn btn-outline hide-desktop" onClick={()=>setFiltersOpen(true)}><Icon name="filter" size={15}/>Filters</button>
      <select className="input" style={{width:210}} value={sort} onChange={e=>setSort(e.target.value)}>
        <option value="rating">Sort: Highest rated</option>
        <option value="mostComplete">Sort: Most completed</option>
        <option value="leastComplete">Sort: Least completed</option>
        <option value="recent">Sort: Recently updated</option>
        <option value="collab">Sort: Most collaborators needed</option>
      </select>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"220px 1fr",gap:28}}>
      <aside className="hide-mobile">{FiltersPanel}</aside>
      <div>
        <div style={{fontSize:12.5,color:"var(--text-dim)",marginBottom:14}}>{loading?"Searching...":`${filtered.length} project${filtered.length!==1?"s":""} found`}</div>
        {loading ? <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:16}}>{[1,2,3,4,5,6].map(i=><ProjectCardSkeleton key={i}/>)}</div>
        : filtered.length===0 ? <EmptyState icon="search" title="No matching projects" text="Try widening your filters or searching a different skill or keyword." action={<button className="btn btn-outline btn-sm" onClick={()=>{setQuery("");setCategory("Any");setCompletion("Any");setSkill("Any");setProjRating("Any");setAvailability("Any");}}>Reset filters</button>}/>
        : <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:16}}>{filtered.map(p=><ProjectCard key={p.id} project={p}/>)}</div>}
      </div>
    </div>

    {filtersOpen && <div className="modal-backdrop" onClick={()=>setFiltersOpen(false)}>
      <div className="modal" style={{maxWidth:340,padding:20}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <span style={{fontWeight:700}}>Filters</span>
          <button className="btn-icon btn-ghost" onClick={()=>setFiltersOpen(false)}><Icon name="close" size={18}/></button>
        </div>
        {FiltersPanel}
        <button className="btn btn-primary btn-block" style={{marginTop:18}} onClick={()=>setFiltersOpen(false)}>Show {filtered.length} results</button>
      </div>
    </div>}
  </div>;
}
function FilterGroup({label,value,onChange,options,display}){
  return <div>
    <div className="label">{label}</div>
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      {options.map(o=>
        <label key={o} style={{display:"flex",alignItems:"center",gap:8,fontSize:13.5,color:value===o?"var(--text)":"var(--text-muted)",cursor:"pointer",padding:"3px 0"}}>
          <input type="radio" name={label} checked={value===o} onChange={()=>onChange(o)} style={{accentColor:"var(--accent)"}}/>
          {display&&display[o]?display[o]:o}
        </label>
      )}
    </div>
  </div>;
}

/* ---------------- PROJECT DETAILS ---------------- */
function ProjectDetails(){
  const {params,go,projects,users,me,requests,sendRequest,bookmarks,toggleBookmark,ratedProjects,submitRating}=useApp();
  const project=projects.find(p=>p.id===params.id) || projects[0];

  const [rateOpen,setRateOpen]=useState(false);
  const [rateVal,setRateVal]=useState(5);
  const [rateText,setRateText]=useState("");
  const saved=bookmarks.includes(project.id);
  const isOwn=project.creatorId===me.id;
  const isCollaborator=project.currentCollaborators.includes(me.id);
  const existingRequest=requests.find(r=>r.projectId===project.id && r.fromUserId===me.id);
  const alreadyRated=ratedProjects.includes(project.id);

  return <div className="container" style={{padding:"36px 0 70px"}}>
    <button className="btn btn-ghost btn-sm" style={{marginBottom:18,paddingLeft:4}} onClick={()=>go("browse")}><Icon name="chevronLeft" size={15}/>Back to Browse</button>
    <div style={{display:"grid",gridTemplateColumns:"1.7fr 1fr",gap:32}}>
      <div>
        <div style={{height:200,borderRadius:18,background:`linear-gradient(135deg, ${colorFor(project.creatorId)}30, var(--surface-2))`,marginBottom:22,display:"flex",alignItems:"flex-end",padding:22,position:"relative"}}>
          <span className="chip" style={{position:"absolute",top:16,left:16}}>{project.category}</span>
          <button onClick={()=>toggleBookmark(project.id)} className="btn-icon" style={{position:"absolute",top:16,right:16,background:"rgba(10,12,15,.55)",border:"1px solid rgba(255,255,255,.08)",color:saved?"var(--accent)":"#fff",borderRadius:9}}><Icon name={saved?"bookmarkFilled":"bookmark"} size={16}/></button>
          <h1 className="font-display" style={{fontSize:26,fontWeight:700}}>{project.title}</h1>
        </div>

        <div style={{display:"flex",gap:20,alignItems:"center",marginBottom:22,flexWrap:"wrap"}}>
          <CompletionRing value={project.completion}/>
          <div>
            <div style={{fontWeight:600,fontSize:14,marginBottom:3}}>Project completion</div>
            <div style={{fontSize:13,color:"var(--text-muted)",maxWidth:340,lineHeight:1.5}}>An estimate of how much of the original scope is functional today — set by the creator and refined as collaborators contribute.</div>
          </div>
        </div>

        <div style={{display:"flex",gap:20,marginBottom:26,flexWrap:"wrap"}}>
          <RatingBadge value={project.projectRating} count={project.ratingCount} label="project rating"/>
          <span style={{color:"var(--border)"}}>·</span>
          <span style={{fontSize:13,color:"var(--text-muted)"}}>Updated {timeAgo(project.lastUpdated)}</span>
          <span style={{color:"var(--border)"}}>·</span>
          <span style={{fontSize:13,color:"var(--text-muted)"}}>{project.currentCollaborators.length}/{project.maxCollaborators} collaborators</span>
        </div>

        <SectionLabel>About this project</SectionLabel>
        <p style={{fontSize:14.5,lineHeight:1.7,color:"var(--text-muted)",marginBottom:26}}>{project.description}</p>

        <SectionLabel>Technologies</SectionLabel>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:26}}>{project.technologies.map(t=><span key={t} className="chip">{t}</span>)}</div>

        <SectionLabel>Skills needed</SectionLabel>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:26}}>{project.requiredSkills.map(t=><span key={t} className="chip chip-accent">{t}</span>)}</div>

        {(project.githubUrl||project.demoUrl) && <>
          <SectionLabel>Links</SectionLabel>
          <div style={{display:"flex",gap:10,marginBottom:26,flexWrap:"wrap"}}>
            {project.githubUrl && <a href={project.githubUrl} target="_blank" rel="noreferrer" className="btn btn-secondary btn-sm"><Icon name="github" size={14}/>Repository</a>}

            {project.currentCollaborators.map(uid=>{const u=users[uid];return (

    </div>}
  </div>;
}
function SectionLabel({children}){return <div style={{fontWeight:700,fontSize:13.5,marginBottom:10,marginTop:4}}>{children}</div>;}

        <SectionHeader title="Saved Projects"/>

/* ---------------- SUBMIT PROJECT ---------------- */
function SubmitProject(){
  const {go,addProject}=useApp();
  const [form,setForm]=useState({title:"",shortDescription:"",description:"",category:"Web",completion:20,technologies:"",requiredSkills:"",maxCollaborators:2,githubUrl:"",demoUrl:""});
  const [errors,setErrors]=useState({});
  const [done,setDone]=useState(false);
  function set(k,v){setForm(f=>({...f,[k]:v}));}
  function validate(){
    const e={};
    if(!form.title.trim()) e.title="Give your project a name.";
    if(!form.shortDescription.trim()) e.shortDescription="A one-line summary helps people scan Browse.";
    if(!form.description.trim()) e.description="Describe what's built and what's left.";
    if(!form.technologies.trim()) e.technologies="List at least one technology.";
    if(!form.requiredSkills.trim()) e.requiredSkills="List at least one skill you need help with.";
    setErrors(e);
    return Object.keys(e).length===0;
  }
  function submit(){
    if(!validate()) return;
    const id=addProject({
      title:form.title,shortDescription:form.shortDescription,description:form.description,category:form.category,
      completion:Number(form.completion),technologies:form.technologies.split(",").map(s=>s.trim()).filter(Boolean),
      requiredSkills:form.requiredSkills.split(",").map(s=>s.trim()).filter(Boolean),maxCollaborators:Number(form.maxCollaborators),
      githubUrl:form.githubUrl,demoUrl:form.demoUrl,looking:true,
    });
    setDone(id);
  }
  if(done) return <div className="container" style={{padding:"90px 0",textAlign:"center"}}>
    <div style={{width:56,height:56,borderRadius:18,background:"rgba(95,179,163,.12)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px",color:"var(--accent-2)"}}><Icon name="check" size={26}/></div>
    <h2 className="font-display" style={{fontSize:22,marginBottom:8}}>Project submitted</h2>
    <p style={{color:"var(--text-muted)",marginBottom:22}}>It's now live in Browse and added to your dashboard.</p>
    <div style={{display:"flex",gap:10,justifyContent:"center"}}>
      <button className="btn btn-primary" onClick={()=>go("project",{id:done})}>View Project</button>
      <button className="btn btn-outline" onClick={()=>go("dashboard",{tab:"myprojects"})}>Go to My Projects</button>
    </div>
  </div>;
  return <div className="container" style={{padding:"36px 0 70px",maxWidth:640}}>
    <h1 className="font-display" style={{fontSize:24,fontWeight:700,marginBottom:6}}>Submit a Project</h1>
    <p style={{color:"var(--text-muted)",fontSize:14,marginBottom:28}}>Tell people what's built, what's missing, and what kind of help would move it forward.</p>
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <Field label="Project name" error={errors.title}><input className="input" value={form.title} onChange={e=>set("title",e.target.value)} placeholder="e.g. Campus Ride Share"/></Field>
      <Field label="Short description" error={errors.shortDescription} hint="Shown on project cards — one sentence."><input className="input" value={form.shortDescription} onChange={e=>set("shortDescription",e.target.value)} placeholder="One line about what it does"/></Field>
      <Field label="Full description" error={errors.description} hint="What's working, what's not, and what kind of help you need."><textarea className="input" rows={5} value={form.description} onChange={e=>set("description",e.target.value)}/></Field>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <Field label="Category"><select className="input" value={form.category} onChange={e=>set("category",e.target.value)}>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></Field>
        <Field label={`Current completion — ${form.completion}%`}><input type="range" min="0" max="100" value={form.completion} onChange={e=>set("completion",e.target.value)} style={{width:"100%",accentColor:"var(--accent)"}}/></Field>
      </div>
      <Field label="Technologies used" error={errors.technologies} hint="Comma-separated, e.g. React, Node.js, MongoDB"><input className="input" value={form.technologies} onChange={e=>set("technologies",e.target.value)}/></Field>
      <Field label="Skills required" error={errors.requiredSkills} hint="Comma-separated, e.g. React, UI/UX"><input className="input" value={form.requiredSkills} onChange={e=>set("requiredSkills",e.target.value)}/></Field>
      <Field label="Collaborators wanted"><input type="number" min="1" max="10" className="input" value={form.maxCollaborators} onChange={e=>set("maxCollaborators",e.target.value)}/></Field>
      <Field label="Repository link (optional)"><input className="input" value={form.githubUrl} onChange={e=>set("githubUrl",e.target.value)} placeholder="https://github.com/..."/></Field>
      <Field label="Demo link (optional)"><input className="input" value={form.demoUrl} onChange={e=>set("demoUrl",e.target.value)} placeholder="https://..."/></Field>
      <button className="btn btn-primary" style={{marginTop:6}} onClick={submit}>Submit Project</button>
    </div>
  </div>;
}
function Field({label,children,error,hint}){
  return <div>
    <label className="label">{label}</label>
    {children}
    {hint && !error && <div style={{fontSize:11.5,color:"var(--text-dim)",marginTop:5}}>{hint}</div>}
    {error && <div style={{fontSize:11.5,color:"var(--error)",marginTop:5}}>{error}</div>}
  </div>;
}

/* ---------------- MESSAGES ---------------- */
function Messages(){
  const {params,conversations,users,me,sendMessage}=useApp();
  const myConvos=conversations.filter(c=>c.participantIds.includes(me.id));
  const [activeId,setActiveId]=useState(params.conversationId||(myConvos[0]&&myConvos[0].id));
  const [text,setText]=useState("");
  useEffect(()=>{if(params.conversationId) setActiveId(params.conversationId);},[params.conversationId]);
  const active=myConvos.find(c=>c.id===activeId);
  const bottomRef=useRef(null);
  useEffect(()=>{if(bottomRef.current) bottomRef.current.scrollIntoView({block:"nearest"});},[activeId,active&&active.messages.length]);

  return <div className="container" style={{padding:"30px 0 60px"}}>
    <h1 className="font-display" style={{fontSize:22,fontWeight:700,marginBottom:18}}>Messages</h1>
    {myConvos.length===0 ? <EmptyState icon="message" title="No conversations yet" text="Once a collaboration request is accepted, you'll be able to chat here."/> :
    <div className="card" style={{display:"grid",gridTemplateColumns:"260px 1fr",height:520,overflow:"hidden"}}>
      <div style={{borderRight:"1px solid var(--border)",overflowY:"auto"}} className={active?"hide-mobile":""}>
        {myConvos.map(c=>{
          const otherId=c.participantIds.find(id=>id!==me.id);const other=users[otherId];
          const last=c.messages[c.messages.length-1];
          return <div key={c.id} onClick={()=>setActiveId(c.id)} style={{padding:"13px 16px",display:"flex",gap:10,cursor:"pointer",background:activeId===c.id?"var(--surface-2)":"transparent",borderBottom:"1px solid var(--border-soft)"}}>
            <Avatar user={other} size={38}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600,fontSize:13.5}}>{other.name}</span></div>
              <div style={{fontSize:12,color:"var(--text-muted)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{last?last.text:"Say hello"}</div>
            </div>
          </div>;
        })}
      </div>
      <div style={{display:"flex",flexDirection:"column"}}>
        {active ? <>
          <div style={{padding:"12px 18px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:10}}>
            <button className="btn-icon btn-ghost hide-desktop" onClick={()=>setActiveId(null)}><Icon name="chevronLeft" size={17}/></button>
            {(()=>{const other=users[active.participantIds.find(id=>id!==me.id)];return <><Avatar user={other} size={30}/><div style={{fontWeight:600,fontSize:13.5}}>{other.name}</div></>;})()}
          </div>
          <div style={{flex:1,overflowY:"auto",padding:18,display:"flex",flexDirection:"column",gap:10}}>
            {active.messages.length===0 && <div style={{fontSize:13,color:"var(--text-dim)",textAlign:"center",marginTop:30}}>No messages yet — say hello.</div>}
            {active.messages.map(m=>{
              const mine=m.fromUserId===me.id;
              return <div key={m.id} style={{alignSelf:mine?"flex-end":"flex-start",maxWidth:"70%"}}>
                <div style={{background:mine?"var(--accent)":"var(--surface-2)",color:mine?"#1a1206":"var(--text)",padding:"9px 13px",borderRadius:mine?"14px 14px 3px 14px":"14px 14px 14px 3px",fontSize:13.5,lineHeight:1.45}}>{m.text}</div>
                <div style={{fontSize:10.5,color:"var(--text-dim)",marginTop:3,textAlign:mine?"right":"left"}}>{new Date(m.timestamp).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>
              </div>;
            })}
            <div ref={bottomRef}/>
          </div>
          <div style={{padding:14,borderTop:"1px solid var(--border)",display:"flex",gap:8}}>
            <input className="input" placeholder="Write a message..." value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&text.trim()){sendMessage(active.id,text.trim());setText("");}}}/>
            <button className="btn btn-primary btn-icon" onClick={()=>{if(text.trim()){sendMessage(active.id,text.trim());setText("");}}}><Icon name="send" size={16}/></button>
          </div>
        </> : <div className="hide-desktop" style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",color:"var(--text-dim)",fontSize:13}}>Select a conversation</div>}
      </div>
    </div>}
  </div>;
}

/* ---------------- ABOUT / FAQ ---------------- */
function About(){
  const {params}=useApp();
  const [openFaq,setOpenFaq]=useState(params.tab==="faq"?0:null);
  const faqs=[
    ["What is Project Graveyard?","A place to discover software projects that stalled for ordinary reasons, and to connect with people who want to help finish them."],
    ["Who can submit a project?","Anyone. There's no approval process — you fill in the details and it's live."],
    ["Can I collaborate on someone else's project?","Yes. Open any project that's looking for collaborators and send a request explaining how you'd help."],
    ["Do I need programming experience?","No — plenty of projects need design, writing, or product help, not just code."],
    ["How does project completion percentage work?","It's the creator's own estimate of how much of the original scope is functional, refined over time as collaborators contribute."],
    ["Can I save projects?","Yes, bookmark any project and find it later under Saved Projects in your dashboard."],
    ["How do collaboration requests work?","You send a short message to the creator; they can view your profile and accept or decline."],
    ["Can I rate projects?","Yes, once you've viewed a project you can leave a star rating and an optional written review."],
    ["Is Project Graveyard free?","Yes — this is a student prototype, not a commercial product."],
  ];
  const team=[["Your Name","Product / Lead Developer"],["Team Member 2","Frontend Developer"],["Team Member 3","Backend Developer"],["Team Member 4","UI/UX / Research"]];
  return <div className="container" style={{padding:"40px 0 70px",maxWidth:760}}>
    <h1 className="font-display" style={{fontSize:28,fontWeight:700,marginBottom:16}}>What is Project Graveyard?</h1>
    <p style={{color:"var(--text-muted)",fontSize:15,lineHeight:1.7,marginBottom:14}}>Most unfinished software isn't bad — it's just stuck. A team graduates, a semester gets busy, a co-founder moves on, and a working idea quietly stops moving. Project Graveyard exists so that work doesn't have to end there.</p>
    <p style={{color:"var(--text-muted)",fontSize:15,lineHeight:1.7,marginBottom:40}}>We're a small directory and collaboration layer — not a hosting platform, not a marketplace. You bring the project or the skills; we help you find the other half.</p>

    <SectionHeader title="How It Works"/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:18,margin:"20px 0 46px"}}>
      {[["01","Discover"],["02","Explore"],["03","Connect"],["04","Collaborate"]].map(([n,t])=>
        <div key={n}><div style={{color:"var(--accent)",fontFamily:"var(--font-display)",fontWeight:700,fontSize:13,marginBottom:6}}>{n}</div><div style={{fontWeight:600,fontSize:14}}>{t}</div></div>
      )}
    </div>

    <SectionHeader title="Frequently asked questions"/>
    <div style={{marginTop:16,marginBottom:50}}>
      {faqs.map(([q,a],i)=>
        <div key={i} style={{borderBottom:"1px solid var(--border-soft)"}}>
          <button onClick={()=>setOpenFaq(openFaq===i?null:i)} style={{width:"100%",background:"none",border:"none",color:"var(--text)",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"15px 2px",textAlign:"left",fontSize:14.5,fontWeight:500}}>
            {q}<Icon name="chevronDown" size={16} className={openFaq===i?"":""} strokeWidth={2}/>
          </button>
          {openFaq===i && <p style={{fontSize:13.5,color:"var(--text-muted)",lineHeight:1.6,padding:"0 2px 16px"}}>{a}</p>}
        </div>
      )}
    </div>

    <SectionHeader title="Team"/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:16,marginTop:18}}>
      {team.map(([n,r])=>
        <div key={n} className="surface2" style={{padding:18,textAlign:"center"}}>
          <div className="avatar" style={{width:52,height:52,margin:"0 auto 10px",background:"var(--surface-3)",color:"var(--text-dim)"}}>{initialsOf(n)}</div>
          <div style={{fontWeight:600,fontSize:13.5}}>{n}</div>
          <div style={{fontSize:11.5,color:"var(--text-dim)",marginTop:2}}>{r}</div>
        </div>
      )}
    </div>
    <div style={{fontSize:11.5,color:"var(--text-dim)",marginTop:10}}>Placeholder team — swap in real names and roles.</div>
  </div>;
}

/* ---------------- AUTH ---------------- */
function Login(){
  const {go,setAuthed,toast}=useApp();
  return <div className="container" style={{padding:"70px 0",maxWidth:380}}>
    <h1 className="font-display" style={{fontSize:24,fontWeight:700,marginBottom:6}}>Log in</h1>
    <p style={{color:"var(--text-muted)",fontSize:13.5,marginBottom:26}}>Welcome back to Project Graveyard.</p>
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <Field label="Email"><input className="input" type="email" placeholder="you@example.com" defaultValue="aisha@example.com"/></Field>
      <Field label="Password"><input className="input" type="password" placeholder="••••••••" defaultValue="password"/></Field>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5}}>
        <label style={{display:"flex",gap:6,alignItems:"center",color:"var(--text-muted)"}}><input type="checkbox" style={{accentColor:"var(--accent)"}}/>Remember me</label>
        <a style={{color:"var(--accent)",cursor:"pointer"}}>Forgot password?</a>
      </div>
      <button className="btn btn-primary btn-block" onClick={()=>{setAuthed(true);toast("Welcome back, Aisha");go("dashboard");}}>Log in</button>
    </div>
    <div style={{fontSize:13,color:"var(--text-muted)",marginTop:20,textAlign:"center"}}>Don't have an account? <a style={{color:"var(--accent)",cursor:"pointer"}} onClick={()=>go("signup")}>Sign up</a></div>
  </div>;
}
function Signup(){
  const {go,setAuthed,toast}=useApp();
  return <div className="container" style={{padding:"70px 0",maxWidth:380}}>
    <h1 className="font-display" style={{fontSize:24,fontWeight:700,marginBottom:6}}>Create your account</h1>
    <p style={{color:"var(--text-muted)",fontSize:13.5,marginBottom:26}}>Join builders finishing what others started.</p>
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <Field label="Name"><input className="input" placeholder="Full name"/></Field>
      <Field label="Username"><input className="input" placeholder="username"/></Field>
      <Field label="Email"><input className="input" type="email" placeholder="you@example.com"/></Field>
      <Field label="Password"><input className="input" type="password" placeholder="••••••••"/></Field>
      <Field label="Confirm password"><input className="input" type="password" placeholder="••••••••"/></Field>
      <Field label="Initial skills" hint="Comma-separated"><input className="input" placeholder="React, Python, UI/UX"/></Field>
      <button className="btn btn-primary btn-block" onClick={()=>{setAuthed(true);toast("Account created — welcome!");go("dashboard");}}>Create Account</button>
    </div>
    <div style={{fontSize:13,color:"var(--text-muted)",marginTop:20,textAlign:"center"}}>Already have an account? <a style={{color:"var(--accent)",cursor:"pointer"}} onClick={()=>go("login")}>Log in</a></div>
  </div>;
}

/* ---------------- ADMIN ---------------- */
function AdminNavbar(){
  const {setViewingAdmin,go,toast}=useApp();
  return <header style={{position:"sticky",top:0,zIndex:60,background:"rgba(10,12,15,.9)",borderBottom:"1px solid var(--border-soft)"}}>
    <div className="container" style={{display:"flex",alignItems:"center",justifyContent:"space-between",height:60}}>
      <div style={{display:"flex",alignItems:"center",gap:9}}>
        <span style={{width:26,height:26,borderRadius:8,background:"var(--surface-3)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--accent)"}}><Icon name="shield" size={14}/></span>
        <span className="font-display" style={{fontWeight:700,fontSize:15}}>Admin</span>
        <span className="chip" style={{marginLeft:6}}>Demo mode</span>
      </div>
      <button className="btn btn-outline btn-sm" onClick={()=>{setViewingAdmin(false);toast("Back to the main site");go("home");}}><Icon name="logOut" size={14}/>Exit Admin</button>
    </div>
  </header>;
}
function AdminPanel(){
  const [tab,setTab]=useState("dashboard");
  const {projects,users,reports,setReports,toast,setProjects}=useApp();
  const tabs=[["dashboard","Dashboard","grid"],["projects","Projects","layers"],["users","Users","users"],["reports","Reports","flag"]];
  const [suspended,setSuspended]=useState([]);
  const [featured,setFeatured]=useState([]);
  const [confirmRemove,setConfirmRemove]=useState(null);

  return <div className="container" style={{padding:"28px 0 70px",display:"grid",gridTemplateColumns:"200px 1fr",gap:28}}>
    <aside>
      <div style={{display:"flex",flexDirection:"column",gap:2}}>
        {tabs.map(([id,label,icon])=><div key={id} className={"sidebar-link"+(tab===id?" active":"")} style={{cursor:"pointer"}} onClick={()=>setTab(id)}><Icon name={icon} size={16}/>{label}
          {id==="reports" && reports.filter(r=>r.status==="pending").length>0 && <span className="badge badge-pending" style={{marginLeft:"auto"}}>{reports.filter(r=>r.status==="pending").length}</span>}
        </div>)}
      </div>
    </aside>
    <div>
      {tab==="dashboard" && <>
        <h1 className="font-display" style={{fontSize:22,fontWeight:700,marginBottom:20}}>Admin Dashboard</h1>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:14}}>
          {[["Total users",Object.keys(users).length],["Total projects",projects.length],["Active collaborations",projects.reduce((s,p)=>s+p.currentCollaborators.length,0)],["Pending reports",reports.filter(r=>r.status==="pending").length]].map(([l,n])=>
            <div key={l} className="surface2" style={{padding:18}}><div className="font-display" style={{fontSize:24,fontWeight:700}}>{n}</div><div style={{fontSize:12,color:"var(--text-dim)",marginTop:4}}>{l}</div></div>
          )}
        </div>
        <SectionHeader title="Recent activity" />
        <div style={{marginTop:16,display:"flex",flexDirection:"column",gap:10}}>
          {[...projects].sort((a,b)=>new Date(b.lastUpdated)-new Date(a.lastUpdated)).slice(0,5).map(p=>
            <div key={p.id} className="surface2" style={{padding:12,display:"flex",justifyContent:"space-between",fontSize:13}}>
              <span>{p.title} updated</span><span style={{color:"var(--text-dim)"}}>{timeAgo(p.lastUpdated)}</span>
            </div>
          )}
        </div>
      </>}

      {tab==="projects" && <>
        <h1 className="font-display" style={{fontSize:22,fontWeight:700,marginBottom:20}}>Projects</h1>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {projects.map(p=><div key={p.id} className="surface2" style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:160}}>
              <div style={{fontWeight:600,fontSize:13.5}}>{p.title} {featured.includes(p.id)&&<span className="chip chip-accent" style={{marginLeft:6}}>Featured</span>}</div>
              <div style={{fontSize:11.5,color:"var(--text-dim)"}}>{p.category} · {p.completion}% · by {users[p.creatorId].name}</div>
            </div>
            <button className="btn btn-outline btn-sm" onClick={()=>setFeatured(f=>f.includes(p.id)?f.filter(x=>x!==p.id):[...f,p.id])}>{featured.includes(p.id)?"Unfeature":"Feature"}</button>
            <button className="btn btn-danger btn-sm" onClick={()=>setConfirmRemove(p.id)}><Icon name="trash" size={13}/>Remove</button>
          </div>)}
        </div>
      </>}

      {tab==="users" && <>
        <h1 className="font-display" style={{fontSize:22,fontWeight:700,marginBottom:20}}>Users</h1>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {Object.values(users).map(u=><div key={u.id} className="surface2" style={{padding:"10px 16px",display:"flex",alignItems:"center",gap:12}}>
            <Avatar user={u} size={32}/>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:13.5}}>{u.name} <span style={{color:"var(--text-dim)",fontWeight:400}}>@{u.username}</span></div>
              <div style={{fontSize:11.5,color:"var(--text-dim)"}}>Rating {u.rating} · {u.createdCount} created · {u.collabCount} collaborations</div>
            </div>
            <span className="badge" style={{background:suspended.includes(u.id)?"rgba(226,102,109,.14)":"rgba(95,179,163,.14)",color:suspended.includes(u.id)?"var(--error)":"var(--accent-2)"}}>{suspended.includes(u.id)?"Suspended":"Active"}</span>
            <button className={"btn btn-sm "+(suspended.includes(u.id)?"btn-secondary":"btn-outline")} onClick={()=>{setSuspended(s=>s.includes(u.id)?s.filter(x=>x!==u.id):[...s,u.id]);toast(suspended.includes(u.id)?"User restored":"User suspended");}}>{suspended.includes(u.id)?"Restore":"Suspend"}</button>
          </div>)}
        </div>
      </>}

      {tab==="reports" && <>
        <h1 className="font-display" style={{fontSize:22,fontWeight:700,marginBottom:20}}>Reports & Moderation</h1>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {reports.length===0 && <EmptyState icon="flag" title="No reports" text="Reported projects and users will show up here."/>}
          {reports.map(r=>{
            const targetLabel=r.type==="project"?projects.find(p=>p.id===r.targetId)?.title:users[r.targetId]?.name;
            return <div key={r.id} className="surface2" style={{padding:16}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
                <div>
                  <span className="chip" style={{textTransform:"capitalize"}}>{r.type}</span>
                  <span style={{fontWeight:600,fontSize:13.5,marginLeft:8}}>{targetLabel}</span>
                </div>
                <span className={"badge badge-"+(r.status==="pending"?"pending":r.status==="dismissed"?"rejected":"accepted")}>{r.status}</span>
              </div>
              <div style={{fontSize:12.5,color:"var(--text-muted)",margin:"8px 0"}}>Reported by {users[r.reporter].name} · {timeAgo(r.date)}</div>
              <div style={{fontSize:13.5,color:"var(--text-muted)"}}>"{r.reason}"</div>
              {r.status==="pending" && <div style={{display:"flex",gap:8,marginTop:12}}>
                <button className="btn btn-outline btn-sm" onClick={()=>{setReports(rs=>rs.map(x=>x.id===r.id?{...x,status:"dismissed"}:x));toast("Report dismissed");}}>Dismiss</button>
                <button className="btn btn-danger btn-sm" onClick={()=>{setReports(rs=>rs.map(x=>x.id===r.id?{...x,status:"actioned"}:x));toast("Action taken");}}>Take Action</button>
              </div>}
            </div>;
          })}
        </div>
      </>}
    </div>

    {confirmRemove && <div className="modal-backdrop" onClick={()=>setConfirmRemove(null)}>
      <div className="modal" style={{padding:22}} onClick={e=>e.stopPropagation()}>
        <div style={{fontWeight:700,fontSize:16,marginBottom:10}}>Remove this project?</div>
        <div style={{fontSize:13.5,color:"var(--text-muted)",marginBottom:18}}>This will permanently remove "{projects.find(p=>p.id===confirmRemove)?.title}" from Project Graveyard. This can't be undone.</div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button className="btn btn-secondary btn-sm" onClick={()=>setConfirmRemove(null)}>Cancel</button>
          <button className="btn btn-danger btn-sm" onClick={()=>{setProjects(ps=>ps.filter(p=>p.id!==confirmRemove));setConfirmRemove(null);toast("Project removed");}}>Remove Project</button>
        </div>
      </div>
    </div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
